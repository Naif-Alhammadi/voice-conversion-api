<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <!-- bootstrap -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

     <!-- website icon image -->
     <link rel="icon" href="../static/images/mic.png">

     <!-- form style -->
      <link rel="stylesheet" href="../static/styles/form.css">


</head>
<body>
    <div class="form-container">
        <div class="login">
        <form action="/login" id="login-form" method="post">

            <label for="name" class="form-label">Name</label>
            <input autocomplete="off" id="name" type="text" placeholder="Enter Your Name" name="name" class="form-control" aria-describedby="passwordHelpBlock" required>
            <div id="name" class="form-text">
                    Your name
            </div>
            <br>


            <label for="email" class="form-label">Email</label>
            <input autocomplete="off" id="email" type="text" placeholder="Enter Your Email" name="email" class="form-control" aria-describedby="passwordHelpBlock" required>
            <div id="passwordHelpBlock" class="form-text">
                    Your email
            </div>
            <br>
                
            <label for="password" class="form-label">Password</label>
            <input autocomplete="off" id="password" type="password" placeholder="Enter Your Password" name="password" class="form-control" aria-describedby="passwordHelpBlock" required><label for="password"><i class="fa-regular fa-eye-slash" id="password-icon"></i></label>
            <div id="passwordHelpBlock" class="form-text">
                    Your password
            </div>
            <br>

            <label for="verifypassword" class="form-label">Verify Password</label>
                <input autocomplete="off" id="verifypassword" type="password" placeholder="Verify Your Password" name="verifypassword" class="form-control" aria-describedby="passwordHelpBlock" required><label for="verifypassword"><i class="fa-regular fa-eye-slash" id="verifypassword-icon"></i></label>
            <div id="passwordHelpBlock" class="form-text">
                    Your password
            </div>

            <div id="passwordHelpBlock" class="form-text error-text">
                    
            </div>

            <button type="submit" class="btn btn-outline-light">Log in</button>
            <button type="button" id="have-question">already have one?</button>
        </form>
        </div>

        <div class="register">
            <form action="">

            <label for="email" class="form-label">Email</label>
            <input autocomplete="off" id="email" type="text" placeholder="Enter Your Email" name="email" class="form-control" aria-describedby="passwordHelpBlock">
            <div id="passwordHelpBlock" class="form-text">
                    Your email
            </div>
            <br>
                
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" placeholder="Enter Your Password" name="password" class="form-control" aria-describedby="passwordHelpBlock"><label for="password"><i class="fa-regular fa-eye-slash" id="password-icon"></i></label>
            <div id="passwordHelpBlock" class="form-text">
                    Your password
            </div>
            <br>

            <button type="submit" class="btn btn-outline-light">Register</button>
            <button type="button" id="donotHave">Don't Have One?</button>
        </form>
        </div>
        </div>
    

    <script src="../static/scripts/viewpassword.js"></script>

    <script src="../static/scripts/form.js"></script>

    <script src="../static/scripts/lightDark.js"></script>

    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- fontawesome -->
    <script src="https://kit.fontawesome.com/ef84b809a9.js" crossorigin="anonymous"></script>
</body>
</html>
